[SERVICE]
    Flush        5
    Log_Level    debug
    Parsers_File parsers.conf

[INPUT]
    Name   syslog
    Mode   tcp
    Port   5140
    Parser syslog-rfc3164
    Tag    docker.

[OUTPUT]
    Name              loki
    Match             *
    Host              logs-prod-012.grafana.net
    Port              443
    TLS               on
    HTTP_User         1445220
    HTTP_Passwd       ${GRAFANA_CLOUD_API_TOKEN}
    Labels            job=fluentbit


