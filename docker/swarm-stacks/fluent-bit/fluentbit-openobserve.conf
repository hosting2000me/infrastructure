[SERVICE]
  Flush        5
  Log_Level    debug
  Parsers_File parsers.conf

[INPUT]
  Name   syslog
  Mode   tcp
  Port   5140
  Parser syslog-rfc3164
  Tag    docker.

[OUTPUT]
  Name http
  Match *
  URI /api/default/fluent-bit/_json
  Host docker-node1
  Port 5080
  tls Off
  Format json
  Json_date_key    _timestamp
  Json_date_format iso8601
  HTTP_User admin@home.com
  HTTP_Passwd ${OPENOBSERVE_PASSWORD}
  compress gzip



