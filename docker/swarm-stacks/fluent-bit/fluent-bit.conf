[SERVICE]
    Flush               5
    Log_Level           debug
    Parsers_File        parsers.conf

[INPUT]
    Name                forward
    Listen              0.0.0.0
    Port                24224
    Tag                 docker

[FILTER]
    Name                parser
    Match               *
    Key_Name            log
    Parser              json
    Reserve_Data        On

[OUTPUT]
    Name                loki
    Match               *
    Host                logs-prod-012.grafana.net
    Port                443
    TLS                 on
    Labels              job=fluentbit
    label_keys          $app_name,$node_name,$level
    line_format         json
    remove_keys         container_id,container_name,source,stream
    drop_single_key     On




