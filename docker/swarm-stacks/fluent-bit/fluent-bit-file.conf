[SERVICE]
    Flush        5
    Log_Level    debug
    Parsers_File parsers.conf

[INPUT]
    Name   syslog
    Mode   tcp
    Port   5140
    Parser syslog-rfc3164
    Tag    docker.

[OUTPUT]
    Name   file
    Match  *
    Path   /var/log/fluent-bit/logs
    File   docker.log
    Format plain
    Mkdir  On



